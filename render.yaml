# Render Blueprint — defines the backend web service.
# See https://render.com/docs/blueprint-spec
services:
  - type: web
    name: content-moderation-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_REPO
        value: lohithg8408/content-moderation-onnx-int8
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ORIGINS
        sync: false          # set manually in dashboard after frontend is deployed
      - key: DATABASE_URL
        sync: false          # set manually — paste your Supabase connection string
